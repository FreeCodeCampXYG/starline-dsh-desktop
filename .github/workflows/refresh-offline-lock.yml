name: Refresh offline lock

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh and commit offline runtime lock
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      NPM_CONFIG_FETCH_RETRIES: 2
      NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: 5000
      NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: 30000
      NPM_CONFIG_FETCH_TIMEOUT: 120000
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: offline-runtime/node-version.txt

      - name: Resolve package lock online
        shell: bash
        run: |
          set -euo pipefail
          fetch_options=(
            --fetch-retries=2
            --fetch-retry-mintimeout=5000
            --fetch-retry-maxtimeout=30000
            --fetch-timeout=120000
          )
          for attempt in 1 2 3; do
            if npm --prefix offline-runtime install --package-lock-only --ignore-scripts --workspaces=false "${fetch_options[@]}"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo 'Offline package-lock resolution failed after 3 attempts.' >&2
              exit 1
            fi
            delay=$((attempt * 15))
            echo "Package registry resolution failed; retrying in ${delay}s (attempt $((attempt + 1))/3)." >&2
            sleep "$delay"
          done

      - name: Validate resolved lock
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const packageJson = JSON.parse(fs.readFileSync('offline-runtime/package.json', 'utf8'));
          const packageLock = JSON.parse(fs.readFileSync('offline-runtime/package-lock.json', 'utf8'));
          const expected = packageJson.dependencies['@deepseek-ai/dsh'];
          const actual = packageLock.packages?.['']?.dependencies?.['@deepseek-ai/dsh'];
          if (expected !== actual) {
            throw new Error(`Offline lock DSH version mismatch: expected ${expected}, got ${actual}`);
          }
          NODE

      - name: Commit updated lock when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- offline-runtime/package-lock.json; then
            echo 'Offline runtime lock is already up to date.'
            exit 0
          fi
          # 锁文件必须和 package.json 同步后再进入 CI，避免各平台自行解析出不同依赖闭包。
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add offline-runtime/package-lock.json
          git commit -m 'chore: refresh offline runtime lock'
          git push origin HEAD:main

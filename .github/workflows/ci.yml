name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: offline-runtime/node-version.txt
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            offline-runtime/package-lock.json

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Verify frontend
        run: |
          npm --prefix frontend run docs:check
          npm --prefix frontend run typecheck
          npm --prefix frontend run build

      - name: Verify Go formatting
        shell: bash
        run: |
          mapfile -t go_files < <(git ls-files '*.go')
          unformatted="$(gofmt -l "${go_files[@]}")"
          if [[ -n "$unformatted" ]]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Test and vet Go
        run: |
          go test -tags webkit2_41 ./...
          go vet -tags webkit2_41 ./...

      - name: Verify offline DSH dependency closure
        run: |
          npm --prefix offline-runtime ci --omit=dev --ignore-scripts --workspaces=false
          node offline-runtime/node_modules/@deepseek-ai/dsh/lib/bin.js --version

  native-build:
    name: Build ${{ matrix.name }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            platform: windows/amd64
            build_tags: ""
            extra_ldflags: -H=windowsgui
          - name: Windows ARM64
            os: windows-11-arm
            platform: windows/arm64
            build_tags: ""
            extra_ldflags: -H=windowsgui
          - name: macOS Intel
            os: macos-15-intel
            platform: darwin/amd64
            build_tags: ""
            extra_ldflags: ""
          - name: macOS Apple Silicon
            os: macos-15
            platform: darwin/arm64
            build_tags: ""
            extra_ldflags: ""
          - name: Linux x64
            os: ubuntu-24.04
            platform: linux/amd64
            build_tags: webkit2_41
            extra_ldflags: ""
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            platform: linux/arm64
            build_tags: webkit2_41
            extra_ldflags: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: offline-runtime/node-version.txt
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0

      - name: Build native application
        shell: bash
        run: |
          args=(build -clean -trimpath -platform "${{ matrix.platform }}" -ldflags "-s -w ${{ matrix.extra_ldflags }} -X main.version=ci")
          if [[ -n "${{ matrix.build_tags }}" ]]; then
            args+=(-tags "${{ matrix.build_tags }}")
          fi
          wails "${args[@]}"

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=4096
  NPM_CONFIG_FETCH_RETRIES: 2
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: 5000
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: 30000
  NPM_CONFIG_FETCH_TIMEOUT: 120000

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: offline-runtime/node-version.txt

      - name: Test launcher command compatibility
        run: go test ./internal/launcher

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Verify frontend
        run: |
          npm --prefix frontend run docs:check
          node --test scripts/generate-release-notes.test.mjs
          npm --prefix frontend run typecheck
          npm --prefix frontend run build

      - name: Verify Go formatting
        shell: bash
        run: |
          mapfile -t go_files < <(git ls-files '*.go')
          unformatted="$(gofmt -l "${go_files[@]}")"
          if [[ -n "$unformatted" ]]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Test and vet Go
        run: |
          go test -tags webkit2_41 ./...
          go vet -tags webkit2_41 ./...

      - name: Validate tracked offline lock
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const packageJson = JSON.parse(fs.readFileSync('offline-runtime/package.json', 'utf8'));
          const packageLock = JSON.parse(fs.readFileSync('offline-runtime/package-lock.json', 'utf8'));
          const expected = packageJson.dependencies['@deepseek-ai/dsh'];
          const actual = packageLock.packages?.['']?.dependencies?.['@deepseek-ai/dsh'];
          if (expected !== actual) {
            throw new Error(`Offline lock DSH version mismatch: expected ${expected}, got ${actual}. Run the Refresh offline lock workflow.`);
          }
          NODE

      - name: Verify offline DSH dependency closure
        run: |
          DSH_VERSION="$(node -p "require('./offline-runtime/package.json').dependencies['@deepseek-ai/dsh']")"
          # CI 只消费已提交且已校验的锁；在线刷新放在手动 workflow，避免每个平台重复解析 registry。
          bash scripts/prepare-offline-runtime.sh --skip-lock-refresh "$DSH_VERSION"

  native-build:
    name: Build ${{ matrix.name }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            platform: windows/amd64
            build_tags: ""
            extra_ldflags: -H=windowsgui
          - name: Windows ARM64
            os: windows-11-arm
            platform: windows/arm64
            build_tags: ""
            extra_ldflags: -H=windowsgui
          - name: macOS Intel
            os: macos-15-intel
            platform: darwin/amd64
            build_tags: ""
            extra_ldflags: ""
          - name: macOS Apple Silicon
            os: macos-15
            platform: darwin/arm64
            build_tags: ""
            extra_ldflags: ""
          - name: Linux x64
            os: ubuntu-24.04
            platform: linux/amd64
            build_tags: webkit2_41
            extra_ldflags: ""
            deb_arch: amd64
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            platform: linux/arm64
            build_tags: webkit2_41
            extra_ldflags: ""
            deb_arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: offline-runtime/node-version.txt

      - name: Test launcher command compatibility on native OS
        run: go test ./internal/launcher

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Cache Wails CLI
        uses: actions/cache@v6
        id: wails-cache
        with:
          path: |
            ~/go/bin/wails
            ~/go/bin/wails.exe
          key: starline-wails-v2.14.0-${{ runner.os }}-${{ runner.arch }}

      - name: Add Go bin to PATH
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Wails CLI on cache miss
        if: steps.wails-cache.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0

      - name: Build native application
        shell: bash
        run: |
          args=(build -clean -trimpath -platform "${{ matrix.platform }}" -ldflags "-s -w ${{ matrix.extra_ldflags }} -X main.version=ci")
          if [[ -n "${{ matrix.build_tags }}" ]]; then
            args+=(-tags "${{ matrix.build_tags }}")
          fi
          wails "${args[@]}"

      - name: Package and inspect Linux DEB
        if: runner.os == 'Linux'
        shell: bash
        run: |
          deb_path="$RUNNER_TEMP/starline-dsh-desktop-ci-${{ matrix.deb_arch }}.deb"
          bash scripts/package-linux-deb.sh \
            0.0.0-ci \
            '${{ matrix.deb_arch }}' \
            build/bin/starline-dsh-desktop \
            "$deb_path"
          sudo apt-get install -y "$deb_path"
          test "$(dpkg-query -W -f='${Architecture}' starline-dsh-desktop)" = '${{ matrix.deb_arch }}'
          test -x /usr/bin/starline-dsh-desktop
          sudo apt-get remove -y starline-dsh-desktop
          test ! -e /usr/bin/starline-dsh-desktop

      - name: Prepare and function-test Windows offline runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dshVersion = node -p "require('./offline-runtime/package.json').dependencies['@deepseek-ai/dsh']"
          ./scripts/prepare-offline-runtime.ps1 -DSHVersion $dshVersion -SkipLockRefresh

      - name: Prepare and function-test macOS/Linux offline runtime
        if: runner.os != 'Windows'
        shell: bash
        run: |
          DSH_VERSION="$(node -p "require('./offline-runtime/package.json').dependencies['@deepseek-ai/dsh']")"
          bash scripts/prepare-offline-runtime.sh --skip-lock-refresh "$DSH_VERSION"

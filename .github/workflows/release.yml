name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version embedded in the artifacts (for example 0.2.0-dev)
        required: true
        default: 0.2.4-dev

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Package ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            platform: windows/amd64
            asset: starline-dsh-desktop-windows-amd64
          - name: Windows ARM64
            os: windows-11-arm
            platform: windows/arm64
            asset: starline-dsh-desktop-windows-arm64
          - name: macOS Intel
            os: macos-15-intel
            platform: darwin/amd64
            asset: starline-dsh-desktop-macos-amd64
          - name: macOS Apple Silicon
            os: macos-15
            platform: darwin/arm64
            asset: starline-dsh-desktop-macos-arm64
          - name: Linux x64
            os: ubuntu-24.04
            platform: linux/amd64
            asset: starline-dsh-desktop-linux-amd64
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            platform: linux/arm64
            asset: starline-dsh-desktop-linux-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: offline-runtime/node-version.txt
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            offline-runtime/package-lock.json

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Ensure NSIS is available
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nsisDirectories = @('C:\Program Files (x86)\NSIS', 'C:\Program Files\NSIS')
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
          }
          foreach ($directory in $nsisDirectories) {
            if (Test-Path -LiteralPath $directory) {
              $directory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
          }

      - name: Install frontend dependencies
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run docs:check

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0

      - name: Resolve and validate version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set package metadata version
        shell: bash
        run: |
          node -e 'const fs = require("fs"); const path = "wails.json"; const data = JSON.parse(fs.readFileSync(path, "utf8")); data.info.productVersion = process.argv[1].split(/[-+]/)[0]; fs.writeFileSync(path, JSON.stringify(data, null, 2) + "\n");' "${{ steps.version.outputs.value }}"

      - name: Resolve pinned offline DSH version
        id: offline
        shell: bash
        run: |
          DSH_VERSION="$(node -p "require('./offline-runtime/package.json').dependencies['@deepseek-ai/dsh']")"
          if [[ ! "$DSH_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid offline DSH version: $DSH_VERSION" >&2
            exit 1
          fi
          echo "dsh=$DSH_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Windows package
        if: runner.os == 'Windows'
        run: wails build -clean -trimpath -platform ${{ matrix.platform }} -nsis -installscope user -ldflags "-s -w -H=windowsgui -X main.version=${{ steps.version.outputs.value }} -X main.defaultDSHVersion=${{ steps.offline.outputs.dsh }}"

      - name: Build macOS package
        if: runner.os == 'macOS'
        run: wails build -clean -trimpath -platform ${{ matrix.platform }} -ldflags "-s -w -X main.version=${{ steps.version.outputs.value }} -X main.defaultDSHVersion=${{ steps.offline.outputs.dsh }}"

      - name: Build Linux package
        if: runner.os == 'Linux'
        run: wails build -clean -trimpath -platform ${{ matrix.platform }} -tags webkit2_41 -ldflags "-s -w -X main.version=${{ steps.version.outputs.value }} -X main.defaultDSHVersion=${{ steps.offline.outputs.dsh }}"

      - name: Prepare Windows offline runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/prepare-offline-runtime.ps1 -DSHVersion '${{ steps.offline.outputs.dsh }}'

      - name: Prepare macOS/Linux offline runtime
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/prepare-offline-runtime.sh '${{ steps.offline.outputs.dsh }}'

      - name: Smoke-test Windows offline web runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:DSH_DESKTOP_OFFLINE_ROOT = (Resolve-Path offline-runtime).Path
          $env:DSH_DESKTOP_RUN_OFFLINE_INTEGRATION = '1'
          go test ./internal/launcher -run TestOfflineRuntimeStartsWeb -count=1 -timeout 2m

      - name: Smoke-test macOS/Linux offline web runtime
        if: runner.os != 'Windows'
        shell: bash
        run: |
          DSH_DESKTOP_OFFLINE_ROOT="$PWD/offline-runtime" \
          DSH_DESKTOP_RUN_OFFLINE_INTEGRATION=1 \
          go test ./internal/launcher -run TestOfflineRuntimeStartsWeb -count=1 -timeout 2m

      - name: Package Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $portable = "release/${{ matrix.asset }}.zip"
          $setup = "release/${{ matrix.asset }}-setup.exe"
          $offline = "release/${{ matrix.asset }}-offline-full.zip"
          Compress-Archive -LiteralPath @('build/bin/starline-dsh-desktop.exe', 'LICENSE', 'NOTICE.md', 'AUTHORS.md') -DestinationPath $portable
          $installers = @(Get-ChildItem -LiteralPath build/bin -Filter '*-installer.exe')
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)."
          }
          Copy-Item -LiteralPath $installers[0].FullName -Destination $setup
          tar.exe -a -c -f $offline -C build/bin starline-dsh-desktop.exe -C ../.. LICENSE NOTICE.md AUTHORS.md offline-runtime
          foreach ($artifact in @($portable, $setup, $offline)) {
            $hash = (Get-FileHash -LiteralPath $artifact -Algorithm SHA256).Hash.ToLower()
            $name = [IO.Path]::GetFileName($artifact)
            "$hash  $name" | Out-File "$artifact.sha256" -Encoding ascii
          }

      - name: Package macOS artifact
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p release
          artifact="release/${{ matrix.asset }}.zip"
          offline_artifact="release/${{ matrix.asset }}-offline-full.zip"
          license_resources="build/bin/starline-dsh-desktop.app/Contents/Resources/licenses"
          mkdir -p "$license_resources"
          cp LICENSE "$license_resources/LICENSE"
          cp NOTICE.md "$license_resources/NOTICE.md"
          cp AUTHORS.md "$license_resources/AUTHORS.md"
          ditto -c -k --sequesterRsrc --keepParent build/bin/starline-dsh-desktop.app "$artifact"
          offline_resources="build/bin/starline-dsh-desktop.app/Contents/Resources/offline-runtime"
          mkdir -p "$offline_resources"
          cp -R offline-runtime/. "$offline_resources/"
          ditto -c -k --sequesterRsrc --keepParent build/bin/starline-dsh-desktop.app "$offline_artifact"
          for package in "$artifact" "$offline_artifact"; do
            shasum -a 256 "$package" | sed 's#release/##' > "$package.sha256"
          done

      - name: Package Linux artifact
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p release
          artifact="release/${{ matrix.asset }}.tar.gz"
          offline_artifact="release/${{ matrix.asset }}-offline-full.tar.gz"
          tar -czf "$artifact" -C build/bin starline-dsh-desktop -C ../.. LICENSE NOTICE.md AUTHORS.md
          offline_stage="$RUNNER_TEMP/${{ matrix.asset }}-offline-full"
          mkdir -p "$offline_stage"
          cp build/bin/starline-dsh-desktop "$offline_stage/"
          cp LICENSE NOTICE.md AUTHORS.md "$offline_stage/"
          cp -a offline-runtime "$offline_stage/"
          tar -C "$offline_stage" -czf "$offline_artifact" starline-dsh-desktop LICENSE NOTICE.md AUTHORS.md offline-runtime
          for package in "$artifact" "$offline_artifact"; do
            sha256sum "$package" | sed 's#release/##' > "$package.sha256"
          done

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Generate combined checksum manifest
        shell: bash
        run: |
          cd release
          find . -maxdepth 1 -type f ! -name '*.sha256' -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release/*

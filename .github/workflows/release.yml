name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version embedded in the artifacts (for example 0.2.0-dev)
        required: true
        default: 0.1.0-dev

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Package ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            platform: windows/amd64
            asset: starline-dsh-desktop-windows-amd64
          - name: Windows ARM64
            os: windows-11-arm
            platform: windows/arm64
            asset: starline-dsh-desktop-windows-arm64
          - name: macOS Intel
            os: macos-15-intel
            platform: darwin/amd64
            asset: starline-dsh-desktop-macos-amd64
          - name: macOS Apple Silicon
            os: macos-15
            platform: darwin/arm64
            asset: starline-dsh-desktop-macos-arm64
          - name: Linux x64
            os: ubuntu-24.04
            platform: linux/amd64
            asset: starline-dsh-desktop-linux-amd64
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            platform: linux/arm64
            asset: starline-dsh-desktop-linux-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Ensure NSIS is available
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nsisDirectories = @('C:\Program Files (x86)\NSIS', 'C:\Program Files\NSIS')
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
          }
          foreach ($directory in $nsisDirectories) {
            if (Test-Path -LiteralPath $directory) {
              $directory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
          }

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0

      - name: Resolve and validate version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set package metadata version
        shell: bash
        run: |
          node -e 'const fs = require("fs"); const path = "wails.json"; const data = JSON.parse(fs.readFileSync(path, "utf8")); data.info.productVersion = process.argv[1].split(/[-+]/)[0]; fs.writeFileSync(path, JSON.stringify(data, null, 2) + "\n");' "${{ steps.version.outputs.value }}"

      - name: Build Windows package
        if: runner.os == 'Windows'
        run: wails build -clean -trimpath -platform ${{ matrix.platform }} -nsis -installscope user -ldflags "-s -w -H=windowsgui -X main.version=${{ steps.version.outputs.value }}"

      - name: Build macOS package
        if: runner.os == 'macOS'
        run: wails build -clean -trimpath -platform ${{ matrix.platform }} -ldflags "-s -w -X main.version=${{ steps.version.outputs.value }}"

      - name: Build Linux package
        if: runner.os == 'Linux'
        run: wails build -clean -trimpath -platform ${{ matrix.platform }} -tags webkit2_41 -ldflags "-s -w -X main.version=${{ steps.version.outputs.value }}"

      - name: Package Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $portable = "release/${{ matrix.asset }}.zip"
          $setup = "release/${{ matrix.asset }}-setup.exe"
          Compress-Archive -LiteralPath build/bin/starline-dsh-desktop.exe -DestinationPath $portable
          $installers = @(Get-ChildItem -LiteralPath build/bin -Filter '*-installer.exe')
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)."
          }
          Copy-Item -LiteralPath $installers[0].FullName -Destination $setup
          foreach ($artifact in @($portable, $setup)) {
            $hash = (Get-FileHash -LiteralPath $artifact -Algorithm SHA256).Hash.ToLower()
            $name = [IO.Path]::GetFileName($artifact)
            "$hash  $name" | Out-File "$artifact.sha256" -Encoding ascii
          }

      - name: Package macOS artifact
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p release
          artifact="release/${{ matrix.asset }}.zip"
          ditto -c -k --sequesterRsrc --keepParent build/bin/starline-dsh-desktop.app "$artifact"
          shasum -a 256 "$artifact" | sed 's#release/##' > "$artifact.sha256"

      - name: Package Linux artifact
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p release
          artifact="release/${{ matrix.asset }}.tar.gz"
          tar -C build/bin -czf "$artifact" starline-dsh-desktop
          sha256sum "$artifact" | sed 's#release/##' > "$artifact.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Generate combined checksum manifest
        shell: bash
        run: |
          cd release
          find . -maxdepth 1 -type f ! -name '*.sha256' -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release/*

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version embedded in the artifacts (for example 0.6.0-dev)
        required: true
        default: 0.6.0-dev

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Package ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            platform: windows/amd64
            asset: windows-x64
          - name: Windows ARM64
            os: windows-11-arm
            platform: windows/arm64
            asset: windows-arm64
          - name: macOS Intel
            os: macos-15-intel
            platform: darwin/amd64
            asset: macos-intel-x64
          - name: macOS Apple Silicon
            os: macos-15
            platform: darwin/arm64
            asset: macos-apple-silicon-arm64
          - name: Linux x64
            os: ubuntu-24.04
            platform: linux/amd64
            asset: linux-x64
            deb_arch: amd64
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            platform: linux/arm64
            asset: linux-arm64
            deb_arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      NPM_CONFIG_FETCH_RETRIES: 2
      NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: 5000
      NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: 30000
      NPM_CONFIG_FETCH_TIMEOUT: 120000
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: offline-runtime/node-version.txt

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Cache NSIS
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: |
            C:\Program Files (x86)\NSIS
            C:\Program Files\NSIS
          key: starline-nsis-3.11.0-${{ matrix.asset }}

      - name: Ensure NSIS is available
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nsisDirectories = @('C:\Program Files (x86)\NSIS', 'C:\Program Files\NSIS')
          function Add-NSISToPath {
            foreach ($directory in $nsisDirectories) {
              if (Test-Path -LiteralPath (Join-Path $directory 'makensis.exe')) {
                if ($env:PATH -notlike "*$directory*") {
                  $env:PATH = "$directory;$env:PATH"
                }
                $directory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              }
            }
          }
          Add-NSISToPath
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            $packagePath = Join-Path $env:RUNNER_TEMP 'nsis.install.3.11.0.nupkg'
            Invoke-WebRequest `
              -UseBasicParsing `
              -Uri 'https://community.chocolatey.org/api/v2/package/nsis.install/3.11.0' `
              -OutFile $packagePath `
              -MaximumRetryCount 3 `
              -RetryIntervalSec 5 `
              -TimeoutSec 60
            $expectedHash = '1435c994d7617964e512fa81303c72931cccbc89f8566dd1b1b960e3b14f70b2'
            $actualHash = (Get-FileHash -LiteralPath $packagePath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $expectedHash) {
              throw "NSIS package SHA-256 mismatch: $actualHash"
            }
            choco install nsis.install --version=3.11.0 -y --no-progress --source $env:RUNNER_TEMP
            if ($LASTEXITCODE -ne 0) {
              throw "Local NSIS package installation failed with exit code $LASTEXITCODE."
            }
            Add-NSISToPath
          }
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            throw 'NSIS makensis.exe is unavailable after cache restore and verified local package installation.'
          }
          makensis /VERSION

      - name: Install frontend dependencies
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run docs:check

      - name: Install Wails CLI
        uses: actions/cache@v6
        id: wails-cache
        with:
          path: |
            ~/go/bin/wails
            ~/go/bin/wails.exe
          key: starline-wails-v2.14.0-${{ runner.os }}-${{ runner.arch }}

      - name: Add Go bin to PATH
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Wails CLI on cache miss
        if: steps.wails-cache.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0

      - name: Resolve and validate version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set package metadata version
        shell: bash
        run: |
          node -e 'const fs = require("fs"); const path = "wails.json"; const data = JSON.parse(fs.readFileSync(path, "utf8")); data.info.productVersion = process.argv[1].split(/[-+]/)[0]; fs.writeFileSync(path, JSON.stringify(data, null, 2) + "\n");' "${{ steps.version.outputs.value }}"

      - name: Resolve pinned offline DSH version
        id: offline
        shell: bash
        run: |
          DSH_VERSION="$(node -p "require('./offline-runtime/package.json').dependencies['@deepseek-ai/dsh']")"
          if [[ ! "$DSH_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid offline DSH version: $DSH_VERSION" >&2
            exit 1
          fi
          echo "dsh=$DSH_VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate tracked offline lock
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const packageJson = JSON.parse(fs.readFileSync('offline-runtime/package.json', 'utf8'));
          const packageLock = JSON.parse(fs.readFileSync('offline-runtime/package-lock.json', 'utf8'));
          const expected = packageJson.dependencies['@deepseek-ai/dsh'];
          const actual = packageLock.packages?.['']?.dependencies?.['@deepseek-ai/dsh'];
          if (expected !== actual) {
            throw new Error(`Offline lock DSH version mismatch: expected ${expected}, got ${actual}. Run the Refresh offline lock workflow.`);
          }
          NODE

      - name: Build Windows package
        if: runner.os == 'Windows'
        run: wails build -clean -trimpath -platform ${{ matrix.platform }} -nsis -installscope user -ldflags "-s -w -H=windowsgui -X main.version=${{ steps.version.outputs.value }} -X main.defaultDSHVersion=${{ steps.offline.outputs.dsh }}"

      - name: Build macOS package
        if: runner.os == 'macOS'
        run: wails build -clean -trimpath -platform ${{ matrix.platform }} -ldflags "-s -w -X main.version=${{ steps.version.outputs.value }} -X main.defaultDSHVersion=${{ steps.offline.outputs.dsh }}"

      - name: Build Linux package
        if: runner.os == 'Linux'
        run: wails build -clean -trimpath -platform ${{ matrix.platform }} -tags webkit2_41 -ldflags "-s -w -X main.version=${{ steps.version.outputs.value }} -X main.defaultDSHVersion=${{ steps.offline.outputs.dsh }}"

      - name: Prepare Windows offline runtime
        if: runner.os == 'Windows'
        timeout-minutes: 20
        shell: pwsh
        run: |
          ./scripts/prepare-offline-runtime.ps1 -DSHVersion '${{ steps.offline.outputs.dsh }}' -SkipLockRefresh

      - name: Prepare macOS/Linux offline runtime
        if: runner.os != 'Windows'
        timeout-minutes: 20
        shell: bash
        run: |
          bash scripts/prepare-offline-runtime.sh --skip-lock-refresh '${{ steps.offline.outputs.dsh }}'

      - name: Smoke-test Windows offline web runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:DSH_DESKTOP_OFFLINE_ROOT = (Resolve-Path offline-runtime).Path
          $env:DSH_DESKTOP_RUN_OFFLINE_INTEGRATION = '1'
          go test ./internal/launcher -run TestOfflineRuntimeStartsWeb -count=1 -timeout 2m

      - name: Smoke-test macOS/Linux offline web runtime
        if: runner.os != 'Windows'
        shell: bash
        run: |
          DSH_DESKTOP_OFFLINE_ROOT="$PWD/offline-runtime" \
          DSH_DESKTOP_RUN_OFFLINE_INTEGRATION=1 \
          go test ./internal/launcher -run TestOfflineRuntimeStartsWeb -count=1 -timeout 2m

      - name: Collect Windows DSH startup logs on failure
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $source = Join-Path $env:LOCALAPPDATA 'starline-dsh-desktop\logs'
          $destination = Join-Path $env:RUNNER_TEMP 'dsh-startup-logs'
          if (Test-Path -LiteralPath $source) {
            Copy-Item -LiteralPath $source -Destination $destination -Recurse -Force
            # 启动 URL 含一次性 token；失败日志用于诊断，不得将可用会话令牌上传为 artifact。
            Get-ChildItem -LiteralPath $destination -Filter 'dsh-*.log' -Recurse | ForEach-Object {
              $content = Get-Content -LiteralPath $_.FullName -Raw
              [IO.File]::WriteAllText($_.FullName, ($content -replace 'token=[^\s&]+', 'token=<redacted>'), (New-Object Text.UTF8Encoding($false)))
            }
          } else {
            "DSH startup log directory was not created: $source" | Out-File -LiteralPath (Join-Path $env:RUNNER_TEMP 'dsh-startup-logs-missing.txt') -Encoding utf8
          }

      - name: Collect macOS/Linux DSH startup logs on failure
        if: failure() && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/dsh-startup-logs"
          mkdir -p "$destination"
          for source in "$HOME/.cache/starline-dsh-desktop/logs" "$HOME/Library/Caches/starline-dsh-desktop/logs"; do
            if [ -d "$source" ]; then
              cp -R "$source" "$destination/"
            fi
          done
          # 启动 URL 含一次性 token；失败日志用于诊断，不得将可用会话令牌上传为 artifact。
          find "$destination" -type f -name 'dsh-*.log' -exec sed -i.bak -E 's/token=[^[:space:]&]+/token=<redacted>/g' {} \;
          find "$destination" -type f -name '*.bak' -delete
          if [ -z "$(find "$destination" -type f -name 'dsh-*.log' -print -quit)" ]; then
            printf 'DSH startup log directory was not created.\n' > "$RUNNER_TEMP/dsh-startup-logs-missing.txt"
          fi

      - name: Upload DSH startup logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: starline-dsh-startup-logs-${{ matrix.asset }}
          path: |
            ${{ runner.temp }}/dsh-startup-logs
            ${{ runner.temp }}/dsh-startup-logs-missing.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Package Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $base = "starline-dsh-desktop-v${{ steps.version.outputs.value }}-${{ matrix.asset }}"
          $portable = "release/$base-portable-online.zip"
          $setup = "release/$base-setup-online.exe"
          $offline = "release/$base-portable-offline-full.zip"
          Compress-Archive -LiteralPath @('build/bin/starline-dsh-desktop.exe', 'LICENSE', 'NOTICE.md', 'AUTHORS.md') -DestinationPath $portable
          $installers = @(Get-ChildItem -LiteralPath build/bin -Filter '*-installer.exe')
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)."
          }
          Copy-Item -LiteralPath $installers[0].FullName -Destination $setup
          tar.exe -a -c -f $offline -C build/bin starline-dsh-desktop.exe -C ../.. LICENSE NOTICE.md AUTHORS.md offline-runtime
          $verifyRoot = Join-Path $env:RUNNER_TEMP ("starline-offline-verify-" + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $verifyRoot | Out-Null
          tar.exe -xf $offline -C $verifyRoot
          if ($LASTEXITCODE -ne 0) {
            throw "Final Windows offline archive extraction failed with exit code $LASTEXITCODE."
          }
          $verifyRuntime = Join-Path $verifyRoot 'offline-runtime'
          & (Join-Path $verifyRuntime 'node.exe') scripts/verify-offline-runtime.mjs verify $verifyRuntime
          if ($LASTEXITCODE -ne 0) {
            throw "Final Windows offline archive verification failed with exit code $LASTEXITCODE."
          }
          foreach ($artifact in @($portable, $setup, $offline)) {
            $hash = (Get-FileHash -LiteralPath $artifact -Algorithm SHA256).Hash.ToLower()
            $name = [IO.Path]::GetFileName($artifact)
            "$hash  $name" | Out-File "$artifact.sha256" -Encoding ascii
          }

      - name: Package macOS artifact
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p release
          base="starline-dsh-desktop-v${{ steps.version.outputs.value }}-${{ matrix.asset }}"
          artifact="release/${base}-app-online.zip"
          offline_artifact="release/${base}-app-offline-full.zip"
          license_resources="build/bin/starline-dsh-desktop.app/Contents/Resources/licenses"
          mkdir -p "$license_resources"
          cp LICENSE "$license_resources/LICENSE"
          cp NOTICE.md "$license_resources/NOTICE.md"
          cp AUTHORS.md "$license_resources/AUTHORS.md"
          ditto -c -k --sequesterRsrc --keepParent build/bin/starline-dsh-desktop.app "$artifact"
          offline_resources="build/bin/starline-dsh-desktop.app/Contents/Resources/offline-runtime"
          mkdir -p "$offline_resources"
          cp -R offline-runtime/. "$offline_resources/"
          ditto -c -k --sequesterRsrc --keepParent build/bin/starline-dsh-desktop.app "$offline_artifact"
          verify_root="$(mktemp -d "$RUNNER_TEMP/starline-offline-verify.XXXXXX")"
          ditto -x -k "$offline_artifact" "$verify_root"
          verify_runtime="$verify_root/starline-dsh-desktop.app/Contents/Resources/offline-runtime"
          "$verify_runtime/node" scripts/verify-offline-runtime.mjs verify "$verify_runtime"
          for package in "$artifact" "$offline_artifact"; do
            shasum -a 256 "$package" | sed 's#release/##' > "$package.sha256"
          done

      - name: Package Linux artifact
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p release
          base="starline-dsh-desktop-v${{ steps.version.outputs.value }}-${{ matrix.asset }}"
          artifact="release/${base}-portable-online.tar.gz"
          deb_artifact="release/${base}-deb-online.deb"
          offline_artifact="release/${base}-portable-offline-full.tar.gz"
          tar -czf "$artifact" -C build/bin starline-dsh-desktop -C ../.. LICENSE NOTICE.md AUTHORS.md
          bash scripts/package-linux-deb.sh \
            '${{ steps.version.outputs.value }}' \
            '${{ matrix.deb_arch }}' \
            build/bin/starline-dsh-desktop \
            "$deb_artifact"
          sudo apt-get install -y "$PWD/$deb_artifact"
          test "$(dpkg-query -W -f='${Architecture}' starline-dsh-desktop)" = '${{ matrix.deb_arch }}'
          test -x /usr/bin/starline-dsh-desktop
          sudo apt-get remove -y starline-dsh-desktop
          test ! -e /usr/bin/starline-dsh-desktop
          offline_stage="$RUNNER_TEMP/${base}-portable-offline-full"
          mkdir -p "$offline_stage"
          cp build/bin/starline-dsh-desktop "$offline_stage/"
          cp LICENSE NOTICE.md AUTHORS.md "$offline_stage/"
          cp -a offline-runtime "$offline_stage/"
          tar -C "$offline_stage" -czf "$offline_artifact" starline-dsh-desktop LICENSE NOTICE.md AUTHORS.md offline-runtime
          verify_root="$(mktemp -d "$RUNNER_TEMP/starline-offline-verify.XXXXXX")"
          tar -xzf "$offline_artifact" -C "$verify_root"
          verify_runtime="$verify_root/offline-runtime"
          "$verify_runtime/node" scripts/verify-offline-runtime.mjs verify "$verify_runtime"
          for package in "$artifact" "$deb_artifact" "$offline_artifact"; do
            sha256sum "$package" | sed 's#release/##' > "$package.sha256"
          done

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: starline-dsh-desktop-${{ matrix.asset }}
          path: release/*
          if-no-files-found: error
          retention-days: 14
          # Release 文件本身已经是 zip/tar/deb/installer，关闭二次压缩以降低 CPU 和内存峰值。
          compression-level: 0

  publish:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: offline-runtime/node-version.txt

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          # 仅下载平台发布包，避免把内部构建文件混入 Release 资产清单。
          pattern: starline-dsh-desktop-*
          path: release
          merge-multiple: true

      - name: Generate combined checksum manifest
        shell: bash
        run: |
          cd release
          find . -maxdepth 1 -type f ! -name '*.sha256' ! -name 'SHA256SUMS.txt' -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Generate release notes from changelog and assets
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/generate-release-notes.mjs \
            --version "$VERSION" \
            --tag "$GITHUB_REF_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --asset-dir release \
            --output "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Starline DSH Desktop ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release/*

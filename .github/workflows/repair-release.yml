name: Repair GitHub Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag whose successful build artifacts should be published
        required: true
        type: string
      run_id:
        description: Completed Release workflow run ID containing the build artifacts
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Publish existing artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: offline-runtime/node-version.txt

      - name: Download artifacts from completed run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        shell: bash
        run: |
          mkdir -p release
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --dir release
          find release -mindepth 2 -type f -print0 | while IFS= read -r -d '' file; do
            mv "$file" release/
          done
          find release -mindepth 1 -type d -empty -delete
          test -n "$(find release -maxdepth 1 -type f -print -quit)"

      - name: Generate combined checksum manifest
        shell: bash
        run: |
          cd release
          find . -maxdepth 1 -type f ! -name '*.sha256' ! -name 'SHA256SUMS.txt' -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Generate release notes from changelog and assets
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          node scripts/generate-release-notes.mjs \
            --version "$VERSION" \
            --tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --asset-dir release \
            --output "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Starline DSH Desktop ${{ inputs.tag }}
          tag_name: ${{ inputs.tag }}
          body_path: ${{ runner.temp }}/release-notes.md
          fail_on_unmatched_files: true
          prerelease: ${{ contains(inputs.tag, '-') }}
          files: release/*

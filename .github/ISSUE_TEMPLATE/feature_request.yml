name: Feature request / 功能建议
description: Suggest an improvement that belongs in the desktop host
title: "[Feature]: "
labels: [enhancement, triage]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我搜索过现有 Issue，没有发现相同建议。
          required: true
        - label: 这个建议与桌面宿主有关，而不是要求重新实现 DSH Agent、会话或插件内核。
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请从使用场景出发，说明当前哪里不方便。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望的用户体验、适用平台和边界。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案

  - type: dropdown
    id: platforms
    attributes:
      label: 涉及平台
      multiple: true
      options:
        - Windows
        - macOS
        - Linux
        - All platforms
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 补充材料
      description: 可以拖入界面草图、截图或相关项目链接。
